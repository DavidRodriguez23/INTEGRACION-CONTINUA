version: '3.8'

services:

  web:
    build: .
    container_name: ganandez_web
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ganandez-net

  db:
    image: mysql:8.0
    container_name: ganandez_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/IT.sql:/docker-entrypoint-initdb.d/IT.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ganandez-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: ganandez_jenkins
    # Se ejecuta como root y se monta el socket de Docker para que el pipeline
    # pueda construir imagenes y desplegar contenedores desde dentro de Jenkins.
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ganandez-net

volumes:
  db_data:
  jenkins_data:

networks:
  ganandez-net:
    driver: bridge
