name: CI - Ganaderia Livestock

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  php-lint:
    name: Validar sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.1 php8.1-mysql php8.1-pdo 2>/dev/null || \
          sudo apt-get install -y php php-mysql
      - name: Verificar version PHP
        run: php --version
      - name: Validar sintaxis PHP
        run: |
          echo "=== Validando archivos PHP ==="
          ERRORS=0
          FILES=$(find . -name "*.php" | grep -v vendor)
          TOTAL=$(echo "$FILES" | wc -l)
          echo "Archivos encontrados: $TOTAL"
          for file in $FILES; do
            php -l "$file" > /dev/null 2>&1 && echo "  v $file" || { echo "  X ERROR: $file"; ERRORS=$((ERRORS+1)); }
          done
          [ $ERRORS -eq 0 ] && echo "v Todos los archivos PHP son validos ($TOTAL archivos)" || exit 1

  project-structure:
    name: Verificar estructura del proyecto
    runs-on: ubuntu-latest
    needs: php-lint
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos y directorios requeridos
        run: |
          echo "=== Verificando estructura ==="
          ERRORS=0
          for f in Dockerfile docker-compose.yml index.php .htaccess Jenkinsfile; do
            [ -f "$f" ] && echo "  v $f" || { echo "  X FALTA: $f"; ERRORS=$((ERRORS+1)); }
          done
          for d in app vistas sql css img; do
            [ -d "$d" ] && echo "  v $d/" || { echo "  X FALTA: $d/"; ERRORS=$((ERRORS+1)); }
          done
          [ $ERRORS -eq 0 ] && echo "v Estructura del proyecto correcta" || exit 1

  docker-config:
    name: Verificar configuracion Docker
    runs-on: ubuntu-latest
    needs: project-structure
    steps:
      - uses: actions/checkout@v4
      - name: Verificar Dockerfile y docker-compose
        run: |
          echo "=== Verificando Dockerfile ==="
          cat Dockerfile
          grep -q "FROM" Dockerfile && echo "  v FROM presente" || exit 1
          grep -q "pdo_mysql" Dockerfile && echo "  v PDO MySQL incluido" || echo "  ! pdo_mysql no encontrado"
          echo "=== Verificando docker-compose.yml ==="
          cat docker-compose.yml
          grep -q "web" docker-compose.yml && echo "  v Servicio web definido" || exit 1
          grep -q "db" docker-compose.yml && echo "  v Servicio db definido" || exit 1
          echo "v Configuracion Docker verificada"

  resumen:
    name: Resumen del pipeline
    runs-on: ubuntu-latest
    needs: [php-lint, project-structure, docker-config]
    if: always()
    steps:
      - name: Resultado final
        run: |
          echo "=========================================="
          echo "  PIPELINE CI - Ganaderia Livestock"
          echo "  Rama  : ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor : ${{ github.actor }}"
          echo "=========================================="
          echo "Jobs ejecutados:"
          echo "  - Validacion PHP sintaxis"
          echo "  - Verificacion estructura proyecto"
          echo "  - Verificacion configuracion Docker"
          echo "Pipeline finalizado exitosamente."
